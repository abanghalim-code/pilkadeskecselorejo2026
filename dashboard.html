<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIPITUNG 2026</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#eef3f8;color:#102c55}body{padding:10px}.page{height:calc(100vh - 20px);display:flex;flex-direction:column;gap:9px}.head{height:78px;flex:none;background:#fff;border:1px solid #dbe4ee;border-radius:14px;padding:8px 15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px #102c5514}.brand{display:flex;align-items:center;gap:10px}.brand img{width:58px;height:58px;object-fit:contain}.small{font-size:10px;font-weight:900;letter-spacing:2px;color:#0758b8}.title{font-size:24px;font-weight:900;line-height:1.05}.sub{font-size:10px;color:#64748b;margin-top:2px}.status{font-size:9px;color:#159447;font-weight:700;margin-top:3px}.err{color:#d71920}.clock{text-align:right}.time{font-size:24px;font-weight:900}.date{font-size:10px;color:#64748b}.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.desa{background:#fff;border:1px solid #dbe4ee;border-radius:14px;padding:10px;display:flex;flex-direction:column;min-width:0;box-shadow:0 4px 15px #102c5514}.dhead{height:65px;flex:none;display:flex;align-items:center;gap:9px;border-bottom:2px solid #e7edf4}.dhead img{width:55px;height:55px;object-fit:contain}.dn{font-size:19px;font-weight:900;color:#0758b8}.ds{font-size:8px;color:#64748b;font-weight:700}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.m{background:#f7f9fc;border:1px solid #e5ebf2;border-radius:7px;padding:5px 7px}.lab{font-size:7px;font-weight:800;color:#64748b}.val{font-size:17px;font-weight:900;margin-top:1px}.wide{grid-column:span 2}.bar{height:7px;background:#e7edf4;border-radius:9px;overflow:hidden;margin-top:3px}.fill{height:100%;background:#0b73d1}.cand{display:grid;gap:5px;margin-top:6px}.c{display:grid;grid-template-columns:28px 1fr auto;align-items:center;border:1px solid #e1e8f0;border-radius:7px;padding:5px 7px}.num{width:25px;height:25px;border-radius:50%;background:#102c55;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}.cn{font-size:9px;font-weight:800}.cv{font-size:18px;font-weight:900}.foot{height:20px;flex:none;text-align:center;font-size:8px;color:#718096;display:flex;align-items:center;justify-content:center}@media(max-width:900px){html,body{overflow:auto}.page{height:auto}.grid{grid-template-columns:1fr}.head{height:auto}.desa{min-height:500px}}
</style>
</head><body><div class="page">
<header class="head"><div class="brand"><img src="assets/logo-sipitung.png" onerror="this.style.display='none'"><div><div class="small">SIPITUNG</div><div class="title">SIPITUNG 2026</div><div class="sub">Rekapitulasi perolehan suara Pilkades Kecamatan Selorejo</div><div id="status" class="status">Memuat data...</div></div></div><div class="clock"><div id="time" class="time">--:--:-- WIB</div><div id="date" class="date">--</div></div></header>
<main id="grid" class="grid"></main><footer class="foot">SIPITUNG 2026 • Pilkades Kecamatan Selorejo • Data dari Google Sheets</footer></div>
<script>
const ID='1GWDd6GWzpbfO6h0LsqWlhCDguDAggSjO5iic1eYslFc',SHEET='dashboard_desa',ORDER=['BANJARSARI','SIDOMULYO','SUMBERAGUNG'];
const logos={BANJARSARI:'assets/desa-banjarsari.jpeg',SIDOMULYO:'assets/desa-sidomulyo.png',SUMBERAGUNG:'assets/desa-sumberagung.jpeg'};
const f=n=>n===''||n==null?'—':new Intl.NumberFormat('id-ID').format(Number(n)||0);
const p=v=>{if(v===''||v==null)return'—';let n=Number(String(v).replace('%','').replace(',','.'));if(n<=1)n*=100;return n.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'};
function card(d){let prog=Number(d.progres_tps)||0;if(prog<=1)prog*=100;return `<section class="desa"><div class="dhead"><img src="${logos[d.desa]||''}" onerror="this.style.display='none'"><div><div class="dn">${d.desa}</div><div class="ds">AGREGAT PER DESA</div></div></div><div class="metrics">
${m('DPT TOTAL',f(d.dpt_total))}${m('SUARA MASUK',f(d.suara_masuk_total))}${m('SUARA SAH',f(d.suara_sah_total))}${m('TIDAK SAH',f(d.suara_tidak_sah_total))}${m('KEHADIRAN L',p(d.kehadiran_l))}${m('KEHADIRAN P',p(d.kehadiran_p))}${m('KEHADIRAN TOTAL',p(d.kehadiran_total))}${m('TIDAK HADIR L',f(d.tidak_hadir_l))}${m('TIDAK HADIR P',f(d.tidak_hadir_p))}${m('TPS',f(d.tps_masuk)+' / '+f(d.tps_total))}<div class="m wide"><div class="lab">PROGRES TPS</div><div class="val">${p(prog)}</div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,prog))}%"></div></div></div></div><div class="cand">${c(1,d.calon_1)}${c(2,d.calon_2)}${c(3,d.calon_3)}</div></section>`}
function m(a,b){return `<div class="m"><div class="lab">${a}</div><div class="val">${b}</div></div>`}function c(n,v){return `<div class="c"><div class="num">${n}</div><div class="cn">CALON ${n}</div><div class="cv">${f(v)}</div></div>`}
function clock(){let d=new Date();document.getElementById('time').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)+' WIB';document.getElementById('date').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(d)}setInterval(clock,1000);clock();
async function load(){let st=document.getElementById('status');try{let u=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET)}`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);let t=await r.text(),j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1)),cols=j.table.cols.map(x=>x.label),rows=j.table.rows.map(x=>Object.fromEntries(cols.map((c,i)=>[c,x.c[i]?.v??'']))),map=Object.fromEntries(rows.map(x=>[String(x.desa).trim().toUpperCase(),x]));document.getElementById('grid').innerHTML=ORDER.map(x=>map[x]?card(map[x]):`<section class="desa"><div class="dn">${x}</div><div class="ds">DATA BELUM TERSEDIA</div></section>`).join('');st.className='status';st.textContent='● Data tersambung • pembaruan otomatis'}catch(e){console.error(e);st.className='status err';st.textContent='● Gagal membaca Google Sheets'}}load();setInterval(load,60000);
</script></body></html>
