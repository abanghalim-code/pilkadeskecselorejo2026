<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIPITUNG 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#eef3f8;color:#102c55}
body{padding:8px}
.page{height:calc(100vh - 16px);display:flex;flex-direction:column;gap:7px;min-height:0}
.head{height:108px;flex:none;background:#fff;border:1px solid #dbe4ee;border-radius:14px;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px #102c5514}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand img{width:92px;height:92px;object-fit:contain;flex:none}
.small{font-size:10px;font-weight:900;letter-spacing:2px;color:#0758b8}
.title{font-size:23px;font-weight:900;line-height:1.05;color:#0758b8;letter-spacing:.2px}
.sub{font-size:16px;color:#102c55;font-weight:900;line-height:1.15;margin-top:2px;max-width:850px}
.status{font-size:9px;color:#159447;font-weight:700;margin-top:3px}
.err{color:#d71920}
.clock{text-align:right}
.time{font-size:27px;font-weight:900}
.date{font-size:10px;color:#64748b;margin-top:2px}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.desa{--accent:#0b73d1;background:#fff;border:1px solid #dbe4ee;border-radius:14px;padding:8px;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;box-shadow:0 4px 15px #102c5514;overflow:hidden;position:relative}
.desa:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--accent)}
.desa::-webkit-scrollbar{width:5px}.desa::-webkit-scrollbar-track{background:transparent}.desa::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}.desa{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
.desa[data-desa="BANJARSARI"]{--accent:#0b73d1}
.desa[data-desa="SIDOMULYO"]{--accent:#19a974}
.desa[data-desa="SUMBERAGUNG"]{--accent:#f59e0b}
.dhead{height:58px;flex:none;display:flex;align-items:center;gap:8px;border-bottom:2px solid #e7edf4}
.dhead img{width:49px;height:49px;object-fit:contain}
.dn{font-size:18px;font-weight:900;color:var(--accent)}
.ds{font-size:7px;color:#64748b;font-weight:700;font-style:italic;line-height:1.2;margin-top:3px;max-width:250px}.live-dot{display:none}

.metrics{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
.m{background:#f7f9fc;border:1px solid #e5ebf2;border-radius:7px;padding:4px 6px;min-width:0}
.m:hover{background:#f2f7fd;border-color:#cfdceb}.metrics .m:nth-child(3){border-left:3px solid #19a974;padding-left:5px}
.lab{font-size:6.5px;font-weight:800;color:#64748b}
.val{font-size:16px;font-weight:900;margin-top:1px}
.wide{grid-column:span 2}

.bar{height:6px;background:#e7edf4;border-radius:9px;overflow:hidden;margin-top:3px}
.fill{height:100%;background:#0b73d1;border-radius:9px;transition:width .5s ease}

.result{margin-top:5px;border:1px solid #dfe7f0;border-radius:10px;background:#fbfdff;padding:7px}
.result-title{font-size:7.5px;font-weight:900;color:#49647f;letter-spacing:.3px;margin-bottom:4px}

.result-body{display:grid;grid-template-columns:96px 1fr;gap:7px;align-items:center}
.donut-wrap{position:relative;width:88px;height:88px;margin:auto}
.donut{width:88px;height:88px;transform:rotate(-90deg)}
.donut-bg{fill:none;stroke:#e8eef5;stroke-width:14}
.donut-seg{fill:none;stroke-width:14;stroke-linecap:butt;transition:stroke-dasharray .6s ease,stroke-dashoffset .6s ease}
.seg1{stroke:#0b73d1}.seg2{stroke:#19a974}.seg3{stroke:#f59e0b}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-total{font-size:16px;font-weight:900;color:#102c55;line-height:1}
.donut-label{font-size:6.5px;color:#718096;font-weight:800;margin-top:2px}
.no-vote{font-size:10px;color:#94a3b8;font-weight:800;line-height:1.2}

.gender-head{display:grid;grid-template-columns:1fr 70px 68px;align-items:center;gap:4px;padding:0 2px 4px;border-bottom:1px solid #e5ebf2;color:#4b6480;font-size:7px;font-weight:900}
.gender-head .g{text-align:center}
.legend{display:grid;gap:0}
.legend-row{display:grid;grid-template-columns:1fr 70px 68px;align-items:center;gap:4px;min-height:27px;border-bottom:1px solid #edf1f5;font-size:8px}
.legend-row:last-child{border-bottom:0}
.swatch{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.sw1{background:#0b73d1}.sw2{background:#19a974}.sw3{background:#f59e0b}
    .winner-card{margin-top:6px;padding:6px 9px;border-radius:8px;border:1px solid #f0d58a;background:linear-gradient(135deg,#fffaf0,#fffdf8);display:flex;align-items:center;justify-content:space-between;gap:8px}
    .winner-left{min-width:0}
    .winner-label{font-size:6.5px;font-weight:900;color:#a66a00;letter-spacing:.5px;text-transform:uppercase}
    .winner-name{font-size:10px;font-weight:900;color:#102c55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .winner-detail{font-size:9px;font-weight:900;color:#a66a00;white-space:nowrap}
    .winner-trophy{font-size:18px;flex:none}
    .legend-row.winner-row{background:#fffaf0;border-radius:5px}
    .legend-row.winner-row .candidate-name{font-weight:900}
.legend-name{font-weight:900;color:#102c55;display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.candidate-name{font-size:9px;font-weight:900;letter-spacing:.1px;overflow:hidden;text-overflow:ellipsis}
.candidate-no{font-size:7px;color:#718096;font-weight:900;margin-right:4px}
.total-val{text-align:right;font-size:12px;font-weight:900;color:#102c55}
.legend-pct{text-align:right;font-size:15px;font-weight:900;line-height:1;color:var(--candidate-color,#102c55);white-space:nowrap}
.result-body{grid-template-columns:130px 1fr}
.donut-wrap{width:112px;height:112px}
.donut{width:112px;height:112px}
.donut-total{font-size:18px}
.donut-label{font-size:7px}
.no-vote{font-size:9px}
.cand{display:none}.c{display:none}
.num{width:25px;height:25px;border-radius:50%;background:#102c55;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}
.cn{font-size:9px;font-weight:800}.cv{font-size:18px;font-weight:900}

.dusun-section{margin-top:7px;border-top:1px solid #e3eaf2;padding-top:6px}.dusun-section-title{font-size:7px;font-weight:900;color:#49647f;letter-spacing:.45px;margin-bottom:5px}.village-winner{margin-top:7px}
.dusun-btn{display:none;margin-top:5px;width:100%;border:1px solid #dbe4ee;background:#f7f9fc;color:var(--accent);border-radius:7px;padding:5px 8px;font-size:7px;font-weight:900;letter-spacing:.2px;cursor:pointer}
.dusun-btn:hover{background:#eef5fb;border-color:var(--accent)}
.dusun-modal{position:fixed;inset:0;background:rgba(16,44,85,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.dusun-modal.show{display:flex}
.dusun-box{width:min(1000px,96vw);max-height:88vh;overflow:auto;background:#fff;border:1px solid #dbe4ee;border-radius:14px;box-shadow:0 18px 55px rgba(16,44,85,.25);padding:14px}
.dusun-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid #e5ebf2;padding-bottom:9px;margin-bottom:10px}
.dusun-title{font-size:15px;font-weight:900;color:var(--accent)}
.dusun-sub{font-size:8px;color:#64748b;font-weight:800;margin-top:4px}
.dusun-close{border:0;background:#eef3f8;color:#102c55;border-radius:7px;width:28px;height:28px;font-weight:900;cursor:pointer}
.dusun-table-wrap{overflow-x:auto}
.dusun-table{width:100%;border-collapse:separate;border-spacing:0;font-size:9px;color:#102c55}
.dusun-table th{background:#f3f7fb;color:#49647f;font-size:7px;font-weight:900;text-transform:uppercase;padding:7px 8px;border-bottom:1px solid #dfe7f0;text-align:right;white-space:nowrap}
.dusun-table th:first-child,.dusun-table td:first-child{text-align:left}
.dusun-table td{padding:8px;border-bottom:1px solid #edf1f5;text-align:right;font-weight:800;white-space:nowrap}
.dusun-table tbody tr:hover td{background:#fbfdff}
.dusun-table .dusun-name{font-weight:900;color:#102c55}
.dusun-table .total-row td{background:#f7f9fc;font-weight:900;border-top:1px solid #dbe4ee}
.dusun-table .candidate-head{color:var(--accent)}
.dusun-table .winner-head{color:#15803d;text-align:left!important}
.dusun-table td.winner-cell{text-align:left!important;font-weight:900}
.winner-badge{display:inline-block;background:#eaf8ef;color:#15803d;border:1px solid #bfe8cb;border-radius:999px;padding:4px 7px;font-size:7px;line-height:1.1;white-space:nowrap}
.winner-badge.tie{background:#fff7e6;color:#a16207;border-color:#f4d38b}
.winner-badge.none{background:#f5f7fa;color:#64748b;border-color:#dfe5ec}
.dusun-empty{padding:18px;text-align:center;color:#94a3b8;font-weight:800;font-size:9px}
.dusun-note{margin-top:8px;font-size:7px;color:#718096;line-height:1.4}

.foot{height:20px;flex:none;text-align:center;font-size:8px;color:#718096;display:flex;align-items:center;justify-content:center}

@media(max-width:1100px){
  .result-body{grid-template-columns:96px 1fr}
  .donut-wrap,.donut{width:92px;height:92px}
}
@media(max-width:900px){
  html,body{overflow:auto;height:auto}
  .page{height:auto;min-height:0}
  .grid{grid-template-columns:1fr}
  .head{height:auto}
  .desa{height:auto;min-height:0}
}
</style>
</head>

<body>
<div class="page">
<header class="head">
  <div class="brand">
    <img src="assets/images/logo-sipitung.png" onerror="this.style.display='none'">
    <div>
      <div class="title">PILKADES 2026 — MOMENTUM KEMANDIRIAN DESA</div>
      <div class="sub">“Jadikan Momentum Pilkades sebagai Titik Kulminasi: Kemandirian Desa Tumbuh, Ketergantungan Harus Runtuh.”</div>
      <div id="status" class="status">Memuat data...</div>
    </div>
  </div>
  <div class="clock">
    <div id="time" class="time">--:--:-- WIB</div>
    <div id="date" class="date">--</div>
  </div>
</header>

<main id="grid" class="grid"></main>

<div id="dusunModal" class="dusun-modal" aria-hidden="true">
  <div class="dusun-box" id="dusunBox">
    <div class="dusun-head">
      <div>
        <div id="dusunTitle" class="dusun-title">RINCIAN PEROLEHAN SUARA — DESA</div>
        <div id="dusunSub" class="dusun-sub"></div>
      </div>
      <button class="dusun-close" onclick="closeDusun()" aria-label="Tutup">×</button>
    </div>
    <div id="dusunContent"></div>
  </div>
</div>

<footer class="foot">SIPITUNG 2026 • Pilkades Kecamatan Selorejo • Data dari Google Sheets</footer>
</div>

<script>
const ID='1GWDd6GWzpbfO6h0LsqWlhCDguDAggSjO5iic1eYslFc',
      SHEET='dashboard_desa',
      ORDER=['BANJARSARI','SIDOMULYO','SUMBERAGUNG'];

const logos={
  BANJARSARI:'assets/images/desa-banjarsari.jpeg',
  SIDOMULYO:'assets/images/desa sidomulyo.png',
  SUMBERAGUNG:'assets/images/desa-sumberagung.jpeg'
};

const taglines={
  BANJARSARI:'Saatnya Transparansi Menjadi Panglima.',
  SIDOMULYO:'Saatnya Rakyat Tahu, Bukan Sekadar Memilih.',
  SUMBERAGUNG:'Saatnya Demokrasi Tak Berhenti di Bilik Suara.'
};

const f=n=>n===''||n==null?'—':new Intl.NumberFormat('id-ID').format(Number(n)||0);

const p=v=>{
  if(v===''||v==null)return'—';
  let n=Number(String(v).replace('%','').replace(',','.'));
  if(n<=1)n*=100;
  return n.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
};

function safeNum(v){
  let n=Number(String(v??'').replace(',','.'));
  return Number.isFinite(n)&&n>0?n:0;
}

function donutSVG(a,b,c){
  const vals=[safeNum(a),safeNum(b),safeNum(c)];
  const total=vals.reduce((x,y)=>x+y,0);
  const r=39, circumference=2*Math.PI*r;
  let offset=0;

  const segs=vals.map((v,i)=>{
    if(total<=0)return '';
    const len=(v/total)*circumference;
    const dash=`${len} ${circumference-len}`;
    const el=`<circle class="donut-seg seg${i+1}" cx="52" cy="52" r="${r}" stroke-dasharray="${dash}" stroke-dashoffset="${-offset}"></circle>`;
    offset+=len;
    return el;
  }).join('');

  return `
    <div class="donut-wrap">
      <svg class="donut" viewBox="0 0 104 104" aria-label="Komposisi perolehan suara">
        <circle class="donut-bg" cx="52" cy="52" r="${r}"></circle>
        ${segs}
      </svg>
      <div class="donut-center">
        ${
          total>0
          ? `<div class="donut-total">${f(total)}</div><div class="donut-label">SUARA</div>`
          : `<div class="no-vote">BELUM ADA<br>SUARA</div>`
        }
      </div>
    </div>`;
}

let candidateMap={};

function candidateName(d,n){
  const desa=String(d.desa||'').trim().toUpperCase();
  return candidateMap[desa]?.[n] || `CALON ${n}`;
}

function buildCandidateMap(rows){
  const map={};
  rows.forEach(r=>{
    const desa=String(r.nama_desa||r.desa||'').trim().toUpperCase();
    const no=Number(r.no_urut||r.no||r.urutan||0);
    const name=String(r.nama_calon||r.calon||'').trim();
    if(desa && no && name) (map[desa] ||= {})[no]=name;
  });
  return map;
}

/* L/P PEROLEHAN SUARA DIHAPUS.
   L/P KEHADIRAN DAN TIDAK HADIR TETAP DITAMPILKAN PADA METRIK. */
function legendRow(n,v,total,d,winnerNo){
  const val=safeNum(v);
  const pct=total>0?(val/total*100):0;
  const cls='sw'+n;
  const colors={1:'#0b73d1',2:'#19a974',3:'#f59e0b'};
  const isWinner=winnerNo===n && val>0;

  return `
    <div class="legend-row ${isWinner?'winner-row':''}">
      <span class="legend-name">
        <span class="swatch ${cls}"></span>
        <span class="candidate-no">${n}</span>
        <span class="candidate-name">${candidateName(d,n)}</span>
      </span>
      <span class="total-val">${f(val)}</span>
      <span class="legend-pct" style="--candidate-color:${colors[n]}">${pct.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})}%</span>
    </div>`;
}

function winnerData(d,vals){
  const candidates=vals.map((total,i)=>({no:i+1,total,name:candidateName(d,i+1)}));
  const active=candidates.filter(x=>x.total>0);
  if(!active.length)return null;
  const max=Math.max(...active.map(x=>x.total));
  const winners=active.filter(x=>x.total===max);
  return winners.length===1 ? winners[0] : {tie:true,total:max,names:winners.map(x=>x.name).join(' & ')};
}

function card(d){
  let prog=Number(d.progres_tps)||0;
  if(prog<=1)prog*=100;

  const vals=[safeNum(d.calon_1),safeNum(d.calon_2),safeNum(d.calon_3)];
  const total=vals.reduce((a,b)=>a+b,0);
  const winner=winnerData(d,vals);
  const winnerNo=winner && !winner.tie ? winner.no : null;
  const dusunHtml=inlineDusunTable(d.desa);
  const winnerHtml=winner ? (winner.tie
    ? `<div class="winner-card village-winner"><div class="winner-trophy">🏆</div><div class="winner-left"><div class="winner-label">PEMENANG TINGKAT DESA — HASIL IMBANG</div><div class="winner-name">${winner.names}</div></div><div class="winner-detail">${f(winner.total)} suara</div></div>`
    : `<div class="winner-card village-winner"><div class="winner-trophy">🏆</div><div class="winner-left"><div class="winner-label">PEMENANG TINGKAT DESA</div><div class="winner-name">${winner.name}</div></div><div class="winner-detail">${f(winner.total)} suara • ${(total>0?winner.total/total*100:0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})}%</div></div>`
  ) : '';

  return `<section class="desa" data-desa="${d.desa}">
    <div class="dhead">
      <img src="${logos[d.desa]||''}" onerror="this.style.display='none'">
      <div>
        <div class="dn">${d.desa}</div>
        <div class="ds">${taglines[String(d.desa).trim().toUpperCase()]||'Data Pilkades Terbuka dan Terukur.'}</div>
      </div>
    </div>

    <div class="metrics">
      ${m('DPT TOTAL',f(d.dpt_total))}
      ${m('SUARA MASUK',f(d.suara_masuk_total))}
      ${m('SUARA SAH',f(d.suara_sah_total))}
      ${m('TIDAK SAH',f(d.suara_tidak_sah_total))}
      ${m('KEHADIRAN L',p(d.kehadiran_l))}
      ${m('KEHADIRAN P',p(d.kehadiran_p))}
      ${m('KEHADIRAN TOTAL',p(d.kehadiran_total))}
      ${m('TIDAK HADIR L',f(d.tidak_hadir_l))}
      ${m('TIDAK HADIR P',f(d.tidak_hadir_p))}
      ${m('TIDAK HADIR TOTAL',f(safeNum(d.tidak_hadir_l)+safeNum(d.tidak_hadir_p)))}
      ${m('TPS',f(d.tps_masuk)+' / '+f(d.tps_total))}
      <div class="m wide">
        <div class="lab">PROGRES TPS</div>
        <div class="val">${p(prog)}</div>
        <div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,prog))}%;background:var(--accent)"></div></div>
      </div>
    </div>

    <div class="result">
      <div class="result-title">PEROLEHAN SUARA CALON</div>
      <div class="result-body">
        ${donutSVG(...vals)}
        <div>
          <div class="gender-head"><span>CALON</span><span class="g">TOTAL</span><span class="g">%</span></div>
          <div class="legend">
            ${legendRow(1,d.calon_1,total,d,winnerNo)}
            ${legendRow(2,d.calon_2,total,d,winnerNo)}
            ${legendRow(3,d.calon_3,total,d,winnerNo)}
          </div>
        </div>
      </div>
    </div>

    ${dusunHtml}
    ${winnerHtml}
  </section>`;
}

let dusunRowsByDesa={};
let dusunCandidateNames={};

function norm(v){return String(v??'').trim().toUpperCase();}

function buildDusunData(praRows,hasilRows){
  const tpsInfo={};
  const grouped={};
  praRows.forEach(r=>{
    const tps=norm(r.nama_tps||r.nama_tps_text);
    const desa=norm(r.nama_desa||r.desa);
    const dusun=String(r.nama_dusun||r.dusun||'').trim() || 'Dusun Belum Diisi';
    if(tps && desa){
      tpsInfo[tps]={desa,dusun};
      grouped[desa] ||= {};
      grouped[desa][dusun] ||= {tps:new Set(),votes:[0,0,0]};
      grouped[desa][dusun].tps.add(tps);
    }
  });

  const nameToNo={};
  Object.keys(candidateMap).forEach(desa=>{
    nameToNo[desa]={};
    Object.entries(candidateMap[desa]).forEach(([no,name])=>{
      nameToNo[desa][norm(name)]=Number(no);
    });
  });

  hasilRows.forEach(r=>{
    const tps=norm(r.nama_tps_text||r.nama_tps);
    const info=tpsInfo[tps];
    if(!info)return;
    const desa=info.desa;
    const dusun=info.dusun;
    const rawName=String(r.nama_calon_text||r.nama_calon||r.calon||'').trim();
    let no=Number(r.no_urut||r.no||r.urutan||0);
    if(!no && rawName) no=nameToNo[desa]?.[norm(rawName)]||0;
    if(!no || no<1 || no>3)return;
    const suara=safeNum(r.suara);
    grouped[desa] ||= {};
    grouped[desa][dusun] ||= {tps:new Set(),votes:[0,0,0]};
    grouped[desa][dusun].tps.add(tps);
    grouped[desa][dusun].votes[no-1]+=suara;
  });

  dusunRowsByDesa={};
  Object.keys(grouped).forEach(desa=>{
    dusunRowsByDesa[desa]=Object.entries(grouped[desa]).map(([dusun,x])=>({
      dusun,tps:Array.from(x.tps).sort(),votes:x.votes,total:x.votes.reduce((a,b)=>a+b,0)
    })).sort((a,b)=>a.dusun.localeCompare(b.dusun,'id'));
  });
}

function inlineDusunTable(desa){
  const dName=norm(desa);
  const rows=dusunRowsByDesa[dName]||[];
  const names=[1,2,3].map(n=>candidateMap[dName]?.[n]||`CALON ${n}`);
  if(!rows.length) return `<div class="dusun-section"><div class="dusun-section-title">RINCIAN PEROLEHAN SUARA PER DUSUN</div><div class="dusun-empty">Belum ada data dusun.</div></div>`;
  const totals=[0,0,0]; rows.forEach(r=>r.votes.forEach((v,i)=>totals[i]+=v));
  const grand=totals.reduce((a,b)=>a+b,0);
  const body=rows.map(r=>{
    const max=Math.max(...r.votes);
    let winner='BELUM ADA', cls='none';
    if(max>0){
      const idx=r.votes.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
      if(idx.length===1){winner=names[idx[0]];cls='';} else {winner='IMBANG';cls='tie';}
    }
    return `<tr><td class="dusun-name">${r.dusun}</td><td>${f(r.votes[0])}</td><td>${f(r.votes[1])}</td><td>${f(r.votes[2])}</td><td>${f(r.total)}</td><td class="winner-cell"><span class="winner-badge ${cls}">${winner}</span></td></tr>`;
  }).join('');
  return `<div class="dusun-section">
    <div class="dusun-section-title">RINCIAN PEROLEHAN SUARA PER DUSUN</div>
    <div class="dusun-table-wrap"><table class="dusun-table"><thead><tr><th>DUSUN</th><th class="candidate-head">${names[0]}</th><th class="candidate-head">${names[1]}</th><th class="candidate-head">${names[2]}</th><th>TOTAL</th><th class="winner-head">PEMENANG</th></tr></thead><tbody>${body}<tr class="total-row"><td>TOTAL DESA</td><td>${f(totals[0])}</td><td>${f(totals[1])}</td><td>${f(totals[2])}</td><td>${f(grand)}</td><td class="winner-cell">—</td></tr></tbody></table></div>
  </div>`;
}

function openDusun(desa){
  const rows=dusunRowsByDesa[norm(desa)]||[];
  const dName=String(desa).trim().toUpperCase();
  const accent=dName==='BANJARSARI'?'#0b73d1':dName==='SIDOMULYO'?'#19a974':'#f59e0b';
  const modal=document.getElementById('dusunModal');
  const box=document.getElementById('dusunBox');
  box.style.setProperty('--accent',accent);
  document.getElementById('dusunTitle').textContent=`RINCIAN PEROLEHAN SUARA — ${dName}`;
  const desaCard=document.querySelector(`.desa[data-desa="${CSS.escape(dName)}"]`);
  const totalSah=desaCard?.querySelector('.metrics .m:nth-child(3) .val')?.textContent||'—';
  const tps=desaCard?.querySelector('.metrics .m:nth-child(11) .val')?.textContent||'—';
  document.getElementById('dusunSub').textContent=`Total Suara Sah : ${totalSah}    •    TPS : ${tps}`;

  const names=[1,2,3].map(n=>candidateMap[dName]?.[n]||`CALON ${n}`);
  const totals=[0,0,0]; rows.forEach(r=>r.votes.forEach((v,i)=>totals[i]+=v));
  const grand=totals.reduce((a,b)=>a+b,0);

  if(!rows.length){
    document.getElementById('dusunContent').innerHTML=`<div class="dusun-empty">Belum ada data hasil suara yang dapat dirinci per dusun.</div>`;
  }else{
    const body=rows.map(r=>{
      const max=Math.max(...r.votes);
      let winner='BELUM ADA';
      let winnerClass='none';
      if(max>0){
        const idx=r.votes.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
        if(idx.length===1){
          winner=names[idx[0]];
          winnerClass='';
        }else{
          winner='IMBANG';
          winnerClass='tie';
        }
      }
      return `<tr>
        <td class="dusun-name">${r.dusun}</td>
        <td>${f(r.votes[0])}</td><td>${f(r.votes[1])}</td><td>${f(r.votes[2])}</td><td>${f(r.total)}</td>
        <td class="winner-cell"><span class="winner-badge ${winnerClass}">${winner}</span></td>
      </tr>`;
    }).join('');
    document.getElementById('dusunContent').innerHTML=`
      <div class="dusun-table-wrap">
        <table class="dusun-table">
          <thead><tr>
            <th>DUSUN</th>
            <th class="candidate-head">${names[0]}</th>
            <th class="candidate-head">${names[1]}</th>
            <th class="candidate-head">${names[2]}</th>
            <th>TOTAL</th>
            <th class="winner-head">PEMENANG</th>
          </tr></thead>
          <tbody>${body}
            <tr class="total-row"><td>TOTAL</td><td>${f(totals[0])}</td><td>${f(totals[1])}</td><td>${f(totals[2])}</td><td>${f(grand)}</td><td class="winner-cell"><span class="winner-badge">DESA</span></td></tr>
          </tbody>
        </table>
      </div>
      <div class="dusun-note">Sumber: pemetaan TPS pada <b>pra_tps</b> dan perolehan suara pada <b>hasil</b>. Setiap TPS dijumlahkan ke dusun sesuai pemetaan TPS. Pemenang dusun ditentukan dari perolehan suara terbanyak pada dusun tersebut.</div>`;
  }
  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
}

function closeDusun(){
  const modal=document.getElementById('dusunModal');
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden','true');
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDusun();});
document.getElementById('dusunModal').addEventListener('click',e=>{if(e.target.id==='dusunModal')closeDusun();});

function m(a,b){
  return `<div class="m"><div class="lab">${a}</div><div class="val">${b}</div></div>`;
}

function c(n,v){
  return `<div class="c">
    <div class="num">${n}</div>
    <div class="cn">CALON ${n}</div>
    <div class="cv">${f(v)}</div>
  </div>`;
}

function clock(){
  let d=new Date();
  document.getElementById('time').textContent=
    new Intl.DateTimeFormat('id-ID',{
      timeZone:'Asia/Jakarta',
      hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
    }).format(d)+' WIB';

  document.getElementById('date').textContent=
    new Intl.DateTimeFormat('id-ID',{
      timeZone:'Asia/Jakarta',
      weekday:'long',day:'2-digit',month:'long',year:'numeric'
    }).format(d);
}

setInterval(clock,1000);
clock();

async function fetchSheet(sheetName){
  const u=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok)throw Error(r.status);
  const t=await r.text();
  const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
  const cols=j.table.cols.map(x=>x.label);
  return j.table.rows.map(x=>Object.fromEntries(
    cols.map((c,i)=>[c,x.c[i]?.v??''])
  ));
}

async function load(){
  let st=document.getElementById('status');

  try{
    const [desaRows, calonRows, praTpsRows, tpsRows, hasilRows]=await Promise.all([
      fetchSheet(SHEET),
      fetchSheet('calon'),
      fetchSheet('pra_tps'),
      fetchSheet('tps'),
      fetchSheet('hasil')
    ]);

    candidateMap=buildCandidateMap(calonRows);
    buildDusunData(praTpsRows,hasilRows);

    const map=Object.fromEntries(
      desaRows.map(x=>[
        String(x.desa).trim().toUpperCase(),
        {...x}
      ])
    );

    /*
      MASTER TPS
      pra_tps = daftar TPS resmi + hubungan TPS -> Desa
    */
    const tpsMaster={};

    praTpsRows.forEach(r=>{
      const namaTps=String(r.nama_tps||'').trim().toUpperCase();
      const desa=String(r.nama_desa||'').trim().toUpperCase();

      if(namaTps && desa){
        tpsMaster[namaTps]=desa;
      }
    });

    /*
      TPS MASUK = TPS unik yang mempunyai data
      di tabel tps ATAU tabel hasil.
      Satu TPS tetap dihitung satu kali.
    */
    const tpsMasuk={};

    ORDER.forEach(desa=>{
      tpsMasuk[desa]=new Set();
    });

    // TPS yang sudah mempunyai record di tabel tps
    tpsRows.forEach(r=>{
      const namaTps=String(r.nama_tps_text||'').trim().toUpperCase();

      if(!namaTps)return;

      const desa=tpsMaster[namaTps];

      if(desa && tpsMasuk[desa]){
        tpsMasuk[desa].add(namaTps);
      }
    });

    // TPS yang sudah mempunyai record di tabel hasil
    hasilRows.forEach(r=>{
      const namaTps=String(r.nama_tps_text||'').trim().toUpperCase();

      if(!namaTps)return;

      const desa=tpsMaster[namaTps];

      if(desa && tpsMasuk[desa]){
        tpsMasuk[desa].add(namaTps);
      }
    });

    /*
      Hitung TPS resmi dari pra_tps dan TPS masuk
      dari gabungan tps + hasil.
    */
    ORDER.forEach(desa=>{
      map[desa].tps_total=
        praTpsRows.filter(r=>
          String(r.nama_desa||'').trim().toUpperCase()===desa
        ).length;

      map[desa].tps_masuk=
        tpsMasuk[desa].size;
    });

    document.getElementById('grid').innerHTML=
      ORDER.map(x=>map[x]
        ?card(map[x])
        :`<section class="desa">
            <div class="dn">${x}</div>
            <div class="ds">DATA BELUM TERSEDIA</div>
          </section>`
      ).join('');

    st.className='status';
    st.textContent='● Data tersambung • pembaruan otomatis';

  }catch(e){
    console.error(e);
    st.className='status err';
    st.textContent='● Gagal membaca Google Sheets';
  }
}

load();
setInterval(load,60000);
</script>
